openapi: 3.1.0
info:
  title: Teak Audience List API
  description: >-
    Create and update list Audiences from a list of player IDs. Teak builds an
    Audience in the background after you send its list: wait for `upload_state`
    to be `ready` before sending to the Audience or sending its list again.
  version: "2.0"
  contact:
    name: Teak
    url: https://teak.io

servers:
  - url: https://api.gocarrot.com
    description: Production

paths:
  /v2/audiences:
    post:
      operationId: createAudience
      summary: Create a list Audience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAudienceRequest"
      responses:
        "200":
          description: Audience created. It is built in the background.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudienceResponse"
        "403":
          description: Invalid secret_key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown game_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
  /v2/audiences/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: The id of a list Audience.
    get:
      operationId: getAudience
      summary: Read a list Audience, including how far its build has got
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/SecretKey"
      responses:
        "200":
          description: The Audience.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudienceResponse"
        "403":
          description: Invalid secret_key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No list Audience with that id for the app, or an unknown game_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
    patch:
      operationId: updateAudience
      summary: Change a list Audience, or replace its list
      description: >-
        Only the parameters sent change. `PUT` is accepted too. Sending
        `players` replaces the whole list and builds the Audience again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAudienceRequest"
      responses:
        "200":
          description: Audience updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudienceResponse"
        "403":
          description: Invalid secret_key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No list Audience with that id for the app, or an unknown game_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.

components:
  parameters:
    GameId:
      name: game_id
      in: query
      required: true
      schema:
        type: string
      description: Your Teak App ID.
    SecretKey:
      name: secret_key
      in: query
      required: true
      schema:
        type: string
      description: Your Teak Server Secret.
  schemas:
    Players:
      type: array
      minItems: 1
      items:
        type: object
        required: [id]
        additionalProperties: false
        properties:
          id:
            oneOf:
              - type: string
                minLength: 1
              - type: integer
            description: The player ID you pass to Teak when you identify the player.
      description: >-
        The players for the Audience. Repeated IDs count once; IDs that don't
        match a player are left out. `id` is the only key accepted today.
    CreateAudienceRequest:
      type: object
      required: [game_id, secret_key, name, players]
      properties:
        game_id:
          type: string
        secret_key:
          type: string
        name:
          type: string
          maxLength: 255
          description: Must not match the name of another Audience for the app that isn't archived.
        description:
          type: string
        players:
          $ref: "#/components/schemas/Players"
    UpdateAudienceRequest:
      type: object
      required: [game_id, secret_key]
      properties:
        game_id:
          type: string
        secret_key:
          type: string
        name:
          type: string
          maxLength: 255
        description:
          type: string
        archived:
          type: boolean
        players:
          $ref: "#/components/schemas/Players"
    AudienceResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        audience:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            description:
              type: [string, "null"]
            archived:
              type: boolean
            upload_state:
              type: string
              enum:
                - uploaded
                - looking_up
                - requesting_warehouse_import
                - requested_warehouse_import
                - ready
              description: The Audience is complete when this is `ready`.
            matched_count:
              type: [integer, "null"]
              description: IDs in the latest list that matched a player. null until counted.
            unmatched_count:
              type: [integer, "null"]
              description: IDs in the latest list that matched no player. null until counted.
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
